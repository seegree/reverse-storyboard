name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/fetch_runtime.py --platform windows --model 256
      - name: Use the bundled FFmpeg in integration tests
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$pwd/runtime/bin"
      - run: python -m pytest -q
      - run: ./scripts/build_windows.ps1 -SkipFetch
      - name: Test the portable EXE away from the checkout and without Python on PATH
        shell: pwsh
        run: |
          $exe = "$pwd/dist/EditDetector/EditDetector-CLI.exe"
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:PYTHONPATH = ''
          $env:EDIT_DETECTOR_RUNTIME = ''
          Set-Location $env:RUNNER_TEMP
          & $exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Portable dependency check failed.' }
          & $exe self-test --output "$env:RUNNER_TEMP/portable-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Portable end-to-end test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: EditDetector-Windows-x64
          path: dist/EditDetector/
          retention-days: 14
