name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/fetch_runtime.py --platform windows --model 256
      - name: Use the bundled FFmpeg in integration tests
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$pwd/runtime/bin"
      - run: python -m pytest -q --junitxml=review/test-results.xml
      - name: Check Tk layout and keyboard navigation
        run: python scripts/check_gui_states.py
      - name: Exercise caption recovery and revision in Tk
        run: |
          python scripts/make_sample.py review/three-shots.mp4
          python scripts/smoke_gui.py review/three-shots.mp4 --output review/gui.docx --caption-failure --options-and-revise
      - run: ./scripts/build_windows.ps1 -SkipFetch
      - name: Validate the packaged CLI away from the checkout
        run: python scripts/validate_portable.py dist/EditDetector --output "${{ runner.temp }}/portable-review"
      - name: Upload review evidence even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-review-evidence
          path: |
            review/
            ${{ runner.temp }}/portable-review/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: EditDetector-Windows-x64
          path: dist/EditDetector/
          retention-days: 14
