name: macOS portable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.png"
      - "**/*.html"

permissions:
  contents: read

jobs:
  portable:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build portable app ZIP
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reverse-Storyboard-macOS-arm64
          path: dist/Reverse Storyboard.app/
          if-no-files-found: error
          retention-days: 14
